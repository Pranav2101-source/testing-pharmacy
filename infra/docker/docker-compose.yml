# Local dev infrastructure.
# Run `docker compose up -d` to start Redis + Meilisearch for local development.
# Run `docker compose --profile full up -d` to also run the Java API container
# (useful for testing the production image locally).
# See .env.example for required env vars.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Local Postgres for verifying things Supabase cannot safely be used to test —
  # principally Row-Level Security, which needs a non-superuser role and a
  # throwaway database (see apps/api-java/RLS_ROLLOUT.md).
  #
  # Opt-in: `docker compose --profile test up -d postgres`. Left out of the default
  # set because day-to-day development still points at Supabase.
  #
  # Port 5433, not 5432, so it cannot collide with a Postgres already installed on
  # the host.
  postgres:
    profiles: ["test"]
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmacy
    volumes:
      # Creates the non-superuser app_user role on first boot. RLS is bypassed
      # entirely by superusers, so connecting as `postgres` would make every policy
      # silently inert — the role is what makes this database useful for testing.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: this image's /etc/hosts resolves localhost to
      # ::1 first, but Meilisearch only binds the IPv4 wildcard (0.0.0.0) — a
      # wget to "localhost" gets a real "connection refused" against ::1 even
      # though the service is up and answering fine on IPv4. Confirmed via
      # `docker exec ... wget http://localhost:7700/health` (fails) vs
      # `wget http://127.0.0.1:7700/health` (succeeds) against the same
      # running container — this container reported "unhealthy" for its
      # entire uptime despite serving real requests correctly throughout.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: ../../apps/api-java
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Transactional email (Resend). Blank is safe — the mailer skips sends and
      # warns rather than failing startup.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      APP_URL: ${APP_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — same fix as the meilisearch healthcheck
      # above and for the identical reason: this image's localhost resolves
      # to ::1 first, but Spring Boot's embedded Tomcat only binds the IPv4
      # wildcard by default, so "localhost" gets refused even when the app
      # is up and healthy on IPv4. Not directly reproduced against this
      # specific service (the `full` profile wasn't running at the time),
      # but confirmed against meilisearch's own container with the exact
      # same base-image + wget + "localhost" combination.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  redis_data:
  meili_data:
  postgres_data:
