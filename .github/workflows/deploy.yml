name: Deploy

# Triggers only after CI passes on main — never blocks CI itself.
# This workflow is a no-op until AWS secrets are added to GitHub.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to AWS App Runner
    # Only deploy when CI succeeded — skip on failure or cancellation.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # "production" environment adds an optional manual approval gate.
    # Create it in: GitHub repo → Settings → Environments → New environment → production
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Creates the App Runner service on first run; updates the image on subsequent runs.
      # App Runner pulls the image using APP_RUNNER_ROLE_ARN (ECR access role).
      # All application env vars (DATABASE_URL, JWT_SECRET, etc.) must be set
      # once in the AWS Console → App Runner → your service → Configuration → Environment.
      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service:          checkup-pharmacy-api
          image:            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          access-role-arn:  ${{ secrets.APP_RUNNER_ROLE_ARN }}
          region:           ${{ secrets.AWS_REGION }}
          cpu:              1
          memory:           2
          port:             4000
          wait-for-service-stability-seconds: 180
