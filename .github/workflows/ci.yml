name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Web + shared TS packages: type-check, build, audit ─────────────────────
  web:
    name: Web · type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pharmacy/database db:generate

      - run: pnpm type-check

      - run: pnpm build

      - name: Dependency security audit
        run: pnpm audit --audit-level=high

  # ── Java API: compile, test, package ───────────────────────────────────────
  api:
    name: API (Java) · build
    runs-on: ubuntu-latest

    # Backing services for the *IT integration tests. These did not exist when the
    # suite was unit-only; the ITs boot the real Spring context against a real
    # Postgres carrying the real Prisma schema, because this schema is Prisma-owned
    # and uses Postgres-only features an in-memory database does not implement.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmacy
        # 5433 to match infra/docker/docker-compose.yml, so the default in
        # AbstractPostgresIT works identically here and on a developer machine.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs BOTH suites: surefire for unit tests (*Test, no database
      # needed) and failsafe for integration tests (*IT, against the services
      # above). They are split so `mvn test` stays fast and Docker-free locally.
      #
      # Includes two build-failing tenant guards:
      #   TenantIsolationGuardTest      — a repository METHOD that reads a
      #                                   tenant-owned entity without scoping.
      #   UnscopedFinderCallGuardTest   — a SERVICE calling an inherited
      #                                   findById/findAllById on a tenant-owned
      #                                   repository without a stated justification.
      # Those checks are the reason this job must stay required.
      - name: Build & test
        working-directory: apps/api-java
        run: mvn -B -ntp verify

      - name: Publish test report
        # Runs even on failure — a red build is exactly when the report is wanted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-java-test-reports
          # Both, not just surefire: an integration failure would otherwise leave no
          # artifact to read, which is precisely the build you most want details from.
          path: |
            apps/api-java/target/surefire-reports/
            apps/api-java/target/failsafe-reports/
          if-no-files-found: warn
