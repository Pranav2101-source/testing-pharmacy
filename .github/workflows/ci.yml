name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Type-check · Build · Audit ──────────────────────────────────────────
  ci:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pharmacy/database db:generate

      - run: pnpm type-check

      - run: pnpm build

      - name: Dependency security audit
        run: pnpm audit --audit-level=high

  # ── 2. Build · Push to ECR · Scan ──────────────────────────────────────────
  # Only runs on push to main (not on PRs).
  # Requires GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  #                          AWS_REGION, ECR_REPOSITORY
  docker:
    name: Build · Push to ECR · Scan
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for uploading Trivy SARIF results
    outputs:
      image: ${{ steps.uri.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Expose the full image URI so the deploy job can reference it without
      # needing to re-derive it from secrets (secrets aren't available in outputs).
      - name: Set image URI output
        id: uri
        run: |
          echo "value=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          # GitHub Actions layer cache — makes repeated builds ~3x faster
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy runs in the same job so it can pull the image using the ECR
      # credentials already configured above — no re-auth needed.
      # exit-code 0: reports CVEs but doesn't block the pipeline yet.
      # Change to 1 when you're ready to enforce no HIGH/CRITICAL in prod.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          format:    sarif
          output:    trivy-results.sarif
          severity:  HIGH,CRITICAL
          exit-code: "0"

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
